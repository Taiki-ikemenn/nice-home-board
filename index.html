<title>nice home board</title>
<style>
/* =====================================================================
   nice home board
   iPad（横向き）の全画面に、時計・天気・ニュース・LINE・タイマー・音楽・レシピを1画面にまとめます。
   ===================================================================== */
:root{
  --bg:#eceef3; --tile:#ffffff; --tile2:#f3f4f7; --tile3:#e7e9ef; --line:#e3e5eb;
  --text:#1b1d22; --sub:#6b7180; --danger:#e5342a; --ok:#1f9d55; --line-green:#06c755;
  --accent:#2f6fed; --on-accent:#ffffff; --accent-text:#2f6fed;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
  --shadow:0 1px 2px rgba(15,20,40,.04), 0 10px 30px rgba(15,25,60,.07);
  --r:26px; --gap:12px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#08090b; --tile:#16171c; --tile2:#202128; --tile3:#2a2b33; --line:#2a2b33;
  --text:#f1f1f4; --sub:#9b9ca8; --danger:#ff6259; --ok:#3ccf7d;
  --accent-soft:color-mix(in srgb, var(--accent) 24%, transparent);
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
img{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 部品 ---------- */
.btn{appearance:none;border:none;border-radius:14px;min-height:46px;padding:8px 18px;font-size:16px;font-weight:650;
  background:var(--tile2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  transition:transform .1s,opacity .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn.sm{min-height:38px;padding:5px 13px;font-size:14px;border-radius:12px}
.btn.icon{width:46px;padding:0}
.btn.sm.icon{width:38px}
.btn.line{background:var(--line-green);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:none;min-height:34px;padding:5px 12px;border-radius:999px;background:var(--tile2);font-size:13.5px;font-weight:650;white-space:nowrap;color:var(--sub)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--tile2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:10px;min-height:32px;padding:4px 11px;font-size:13.5px;font-weight:650;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--tile);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme=dark] .seg button.on{background:var(--tile3)}
.input{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--tile2);border-radius:14px;padding:10px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--accent)}
.hint{font-size:13.5px;color:var(--sub);line-height:1.6}
.switch{position:relative;width:54px;height:32px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--tile3);transition:.2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(22px)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#ff3b30;color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--sub);padding:8px;font-size:14.5px;line-height:1.6}
.empty .big{font-size:40px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--tile3);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 盤面（1画面のレイアウト） ---------- */
#board{position:fixed;inset:0;display:grid;gap:var(--gap);
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  grid-template-columns:1fr 1.12fr .95fr;grid-template-rows:1.12fr 1fr;
  grid-template-areas:"clock news line" "timer music recipe"}
.tile{background:var(--tile);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 17px 16px;min-width:0;min-height:0;
  display:flex;flex-direction:column;overflow:hidden;position:relative;container-type:size}
.thead{display:flex;align-items:center;gap:8px;min-height:36px;flex:none;margin-bottom:8px}
.thead h2{font-size:17px;font-weight:750;display:flex;align-items:center;gap:8px;white-space:nowrap}
.thead .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--accent-soft);flex:none}
.thead .sp{flex:1}
.tbody{flex:1;min-height:0;display:flex;flex-direction:column}
#tClock{grid-area:clock}#tNews{grid-area:news}#tLine{grid-area:line}#tTimer{grid-area:timer}#tMusic{grid-area:music}#tRecipe{grid-area:recipe}

@media (orientation:portrait){
  html,body{height:auto;overflow:visible}
  #board{position:relative;inset:auto;min-height:100dvh;grid-template-columns:1fr 1fr;grid-template-rows:auto;
    grid-template-areas:"clock clock" "news line" "timer recipe" "music music";grid-auto-rows:auto}
  #tClock{height:400px}#tNews,#tLine{height:470px}#tTimer,#tRecipe{height:400px}#tMusic{height:auto;min-height:420px}
  #tMusic .mu-slot{width:min(100%,640px);margin:0 auto}
}

/* ---------- 時計・天気 ---------- */
.t-clock{color:#fff;background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--accent) 55%, #fff 45%) 0%, transparent 55%),
  linear-gradient(155deg, color-mix(in srgb,var(--accent) 88%, #fff 12%) 0%, color-mix(in srgb,var(--accent) 72%, #000 28%) 100%)}
:root[data-theme=dark] .t-clock{background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--accent) 45%, transparent) 0%, transparent 60%),
  linear-gradient(155deg, color-mix(in srgb,var(--accent) 38%, #16171c) 0%, #121318 100%)}
.ck-top{display:flex;align-items:center;gap:8px;flex:none}
.ck-date{font-size:19px;font-weight:700;letter-spacing:.02em;flex:1;min-width:0}
.ck-date small{display:block;font-size:13px;font-weight:600;opacity:.8;margin-top:1px}
.glassbtn{border:none;width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.18);color:#fff;font-size:18px;display:grid;place-items:center;flex:none}
.glassbtn:active{transform:scale(.94)}
.ck-time{font-weight:250;line-height:.95;letter-spacing:-.035em;font-size:min(29cqw,30cqh);margin:2px 0 0 -4px;white-space:nowrap;display:flex;align-items:baseline}
.ck-time .ap{font-size:.24em;font-weight:600;letter-spacing:0;margin-right:.18em;opacity:.85}
.ck-time .sec{font-size:.3em;font-weight:400;opacity:.7;margin-left:.12em;letter-spacing:0}
.ck-wx{display:flex;align-items:center;gap:12px;margin-top:auto}
.ck-wx .em{font-size:min(48px,13cqh);line-height:1}
.ck-wx .tp{font-size:min(44px,12cqh);font-weight:350;letter-spacing:-.02em}
.ck-wx .ds{font-size:14px;line-height:1.45;opacity:.92;min-width:0}
.ck-wx .ds b{font-size:16px;display:block}
.ck-hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:rgba(255,255,255,.14);border-radius:16px;padding:7px 6px;margin-top:10px;flex:none}
.ck-hours div{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px}
.ck-hours .e{font-size:21px;line-height:1.25}
.ck-hours b{font-size:14.5px;font-weight:650}
.ck-hours .p{font-size:11px;opacity:.8}
.ck-foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;opacity:.88;margin-top:9px;flex:none}
.ck-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-height:370px){ .ck-hours .p{display:none} .ck-hours .e{font-size:18px} }
@container (max-height:335px){ .ck-hours{display:none} }

/* ---------- ニュース ---------- */
.nw-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -8px;padding:0 0 2px;scrollbar-width:none;scroll-behavior:smooth}
.nw-list::-webkit-scrollbar{display:none}
.nw-item{border:none;background:transparent;text-align:left;display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:15px;transition:background .4s}
.nw-item.on{background:var(--accent-soft)}
.nw-item .t{font-size:12.5px;color:var(--sub);font-weight:650;width:38px;flex:none;padding-top:2px}
.nw-item .x{flex:1;min-width:0}
.nw-item .x b{font-size:16px;font-weight:650;line-height:1.42}
.nw-item .x small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.nw-item img{width:64px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--tile2)}
.nw-foot{font-size:12px;color:var(--sub);margin-top:6px;flex:none;display:flex;justify-content:space-between;gap:8px}

/* ---------- LINE ---------- */
.ln-ic{background:var(--line-green)!important;color:#fff;font-weight:900;font-size:10.5px!important;letter-spacing:-.02em}
.ln-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -8px;scrollbar-width:none}
.ln-list::-webkit-scrollbar{display:none}
.ln-row{border:none;background:transparent;text-align:left;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:15px;width:100%}
.ln-row:active{background:var(--tile2)}
.ln-row .x{flex:1;min-width:0}
.ln-row .x b{font-size:15.5px;display:block}
.ln-row .x small{font-size:13.5px;color:var(--sub);display:block;margin-top:1px}
.ln-row .m{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:11.5px;color:var(--sub)}
.ln-row .m .badge{background:var(--line-green)}
.av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center;flex:none}
.av.sm{width:32px;height:32px;font-size:13px}
.ln-state{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
.ln-state.ok{background:var(--line-green);box-shadow:0 0 0 4px color-mix(in srgb,var(--line-green) 22%,transparent)}
.ln-state.err{background:var(--danger)}
.ln-state.wait{background:#f5a524}

/* ---------- タイマー・アラーム・ストップウォッチ ---------- */
.tm-view{flex:1;min-height:0;display:flex;flex-direction:column}
.tm-big{font-size:min(23cqw,22cqh);font-weight:300;letter-spacing:-.03em;text-align:center;line-height:1;margin:auto 0 0}
.tm-big.ring{color:var(--danger);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tm-sub{text-align:center;font-size:13.5px;color:var(--sub);min-height:20px;margin-top:6px}
.tm-bar{height:6px;border-radius:3px;background:var(--tile2);overflow:hidden;margin:10px 4px 0}
.tm-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s linear}
.tm-pre{display:flex;gap:5px;justify-content:center;margin-top:auto;padding-top:10px;flex-wrap:nowrap}
.tm-pre .chip{min-height:38px;padding:5px 10px;font-size:14px;color:var(--text);flex:1 1 0;min-width:0}
.tm-btns{display:flex;gap:8px;margin-top:10px}
.tm-btns .btn{flex:1}
.al-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.al-list::-webkit-scrollbar{display:none}
.al-row{display:flex;align-items:center;gap:10px;background:var(--tile2);border-radius:16px;padding:8px 12px 8px 14px}
.al-row .x{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0}
.al-row .x b{font-size:26px;font-weight:350;letter-spacing:-.01em;display:block;line-height:1.1}
.al-row .x small{font-size:12.5px;color:var(--sub)}
.al-row.off .x b{color:var(--sub)}
.sw-laps{flex:1;min-height:0;overflow-y:auto;font-size:13.5px;color:var(--sub);margin-top:8px;padding:0 6px;scrollbar-width:none}
.sw-laps div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}

/* ---------- 音楽 ---------- */
.mu-slot{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;flex:none}
.mu-poster{position:absolute;inset:0;border:none;padding:0;background:#000 center/cover no-repeat;display:grid;place-items:center}
.mu-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.mu-poster .pl{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:26px;display:grid;place-items:center;padding-left:4px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.mu-poster .cap{position:absolute;z-index:1;left:12px;right:12px;bottom:10px;color:#fff;font-size:13px;font-weight:650;text-align:left}
.mu-info{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:0;flex:none}
.mu-info .x{flex:1;min-width:0}
.mu-info .x b{display:block;font-size:15px}
.mu-info .x small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.mu-ctl{display:flex;gap:6px;flex:none}
.mu-ctl .btn{width:44px;min-height:44px;padding:0;font-size:17px;border-radius:50%}
.mu-ctl .btn.primary{width:50px;min-height:50px;font-size:19px}
@container (max-height:330px){ .mu-info{margin-top:6px} .mu-info .x small{display:none} }
#ytDock{position:fixed;z-index:40;border-radius:16px;overflow:hidden;background:#000;transition:left .25s,top .25s,width .25s,height .25s,box-shadow .25s}
#ytDock.float{z-index:95;box-shadow:0 18px 50px rgba(0,0,0,.45)}
body.ytfloat .sh-body:not(.fill){padding-bottom:240px}
#ytDock iframe,#ytPlayer{width:100%;height:100%;border:0;display:block}
.livebadge{display:inline-block;background:#e5342a;color:#fff;font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:1px}

/* ---------- レシピ ---------- */
.rc-card{flex:1;min-height:0;border-radius:18px;overflow:hidden;position:relative;background:var(--tile2);border:none;padding:0;text-align:left;display:block;width:100%}
.rc-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rc-card .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.rc-card .cap{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.rc-card .cap small{font-size:12.5px;font-weight:650;opacity:.9;display:block;margin-bottom:3px}
.rc-card .cap b{font-size:19px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.rc-ai{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:16px 18px;gap:6px;
  background:radial-gradient(90% 80% at 85% 10%, color-mix(in srgb,#ffb648 55%, transparent), transparent 60%),linear-gradient(150deg,#ff7a59,#e2456f 60%,#8f3fd1);color:#fff}
.rc-ai .em{font-size:min(56px,18cqh);line-height:1}
.rc-ai b{font-size:20px;line-height:1.35}
.rc-ai p{font-size:13.5px;line-height:1.55;opacity:.95;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rc-ai small{font-size:12.5px;font-weight:650;opacity:.9}
.rc-btns{display:flex;gap:8px;margin-top:10px;flex:none}
.rc-btns .btn{flex:1}
@container (max-height:330px){ .rc-ai p{-webkit-line-clamp:2} }

/* ---------- 詳細画面（シート） ---------- */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(10,12,20,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(1000px,100%);height:min(740px,100%);background:var(--tile);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:pop .28s cubic-bezier(.2,1.1,.3,1)}
.sheet.narrow{width:min(640px,100%)}
@keyframes pop{from{transform:translateY(24px) scale(.97);opacity:0}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 22px;border-bottom:1px solid var(--line);flex:none}
.sh-head h3{font-size:20px;font-weight:750;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 24px;-webkit-overflow-scrolling:touch}
.sh-body.fill{display:flex;flex-direction:column;overflow:hidden;padding:0}
.sgroup{background:var(--tile2);border-radius:20px;padding:6px 16px;margin-bottom:14px}
.sgroup h4{font-size:13px;color:var(--sub);font-weight:700;padding:10px 0 4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-height:56px;font-size:16px}
.sgroup h4 + .srow{border-top:none}
.srow.col{flex-direction:column;align-items:stretch}
.srow .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (orientation:portrait){ .cols2{grid-template-columns:1fr} }

/* 天気の詳細 */
.wx-hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.wx-hours div{flex:none;width:62px;background:var(--tile2);border-radius:16px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.wx-hours .e{font-size:24px}
.wx-days{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.wx-days div{display:grid;grid-template-columns:110px 40px 1fr 60px 90px;align-items:center;gap:10px;background:var(--tile2);border-radius:14px;padding:10px 14px;font-size:15.5px}
.wx-days .e{font-size:24px}
.wx-days .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#5aa9ff,#ffb648)}
.wx-now{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.wx-now .e{font-size:72px}
.wx-now .t{font-size:56px;font-weight:300}

/* ニュースの記事 */
.art img{width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin-bottom:14px}
.art h1{font-size:24px;line-height:1.45;margin-bottom:8px}
.art .meta{font-size:13.5px;color:var(--sub);margin-bottom:14px}
.art .body{font-size:17px;line-height:1.95;white-space:pre-wrap;-webkit-user-select:text;user-select:text}

/* LINE のトーク */
.lnv{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;min-height:0}
.lnv .list{border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.lnv .ln-row.on{background:var(--accent-soft)}
.lnv .conv{display:flex;flex-direction:column;min-height:0}
.lnv .msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,#8cabd9 16%,var(--tile))}
.lnv .ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lnv .ch b{font-size:17px;flex:1;min-width:0}
.lnday{text-align:center}.lnday span{display:inline-block;font-size:12px;color:#fff;background:rgba(0,0,0,.28);padding:3px 12px;border-radius:999px}
.lnmsg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.lnmsg .av{align-self:flex-start}
.lnb{display:flex;flex-direction:column;gap:3px;min-width:0}
.lnsn{font-size:12px;color:var(--sub);padding-left:4px}
.lnbub{background:var(--tile);padding:10px 14px;border-radius:4px 18px 18px 18px;font-size:16.5px;line-height:1.55;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.06);-webkit-user-select:text;user-select:text}
.lnt{font-size:11px;color:var(--sub);flex:none}
.lnfoot{padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
@media (orientation:portrait){ .lnv{grid-template-columns:1fr} .lnv.sel .list{display:none} .lnv:not(.sel) .conv{display:none} }

/* 音楽をさがす */
.mu-search{display:flex;gap:8px;margin-bottom:12px}
.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding-bottom:210px}
.mu-card{border:none;background:var(--tile2);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.mu-card .th{aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative}
.mu-card .th .livebadge{position:absolute;left:8px;top:8px}
.mu-card.on{outline:3px solid var(--accent)}
.mu-card .x{padding:9px 11px 11px}
.mu-card .x b{font-size:14px;line-height:1.4}
.mu-card .x small{display:block;font-size:12px;color:var(--sub);margin-top:3px}

/* レシピの詳細 */
.rcd-hero{width:100%;aspect-ratio:16/9;max-height:340px;object-fit:cover;border-radius:20px;margin-bottom:14px}
.rcd-aihero{border-radius:20px;padding:22px;margin-bottom:14px;color:#fff;background:linear-gradient(150deg,#ff7a59,#e2456f 60%,#8f3fd1)}
.rcd-aihero .em{font-size:60px}
.rcd h1{font-size:24px;line-height:1.4}
.rcd .meta{font-size:14px;color:var(--sub);margin:6px 0 14px}
.rcd h4{font-size:16px;margin:16px 0 8px}
.rcd .ing{display:grid;grid-template-columns:1fr auto;gap:0 14px;background:var(--tile2);border-radius:16px;padding:6px 16px}
.rcd .ing span{padding:8px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.rcd .ing span:nth-last-child(-n+2){border-bottom:none}
.rcd .ing span:nth-child(even){color:var(--sub);text-align:right}
.rcd ol{padding-left:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.rcd ol li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;gap:10px;font-size:16px;line-height:1.7}
.rcd ol li::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:14px;margin-top:2px}
.rcd .tip{background:var(--accent-soft);border-radius:16px;padding:12px 16px;margin-top:14px;font-size:15px;line-height:1.7}
.ai-ask{display:flex;gap:8px;margin-bottom:12px}

/* アラームの編集 */
.al-time{font-size:56px;font-weight:300;text-align:center;border:none;background:var(--tile2);border-radius:20px;width:100%;padding:10px;min-height:96px}
.days{display:flex;gap:6px;justify-content:space-between}
.days button{flex:1;min-height:46px;border:none;border-radius:14px;background:var(--tile2);font-weight:700;font-size:16px}
.days button.on{background:var(--accent);color:var(--on-accent)}

/* ---------- 鳴動画面 ---------- */
#ring{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;padding:24px;
  background:radial-gradient(80% 60% at 50% 40%, color-mix(in srgb,var(--accent) 70%, #fff 30%), color-mix(in srgb,var(--accent) 60%, #000 40%))}
#ring.show{display:flex;animation:fade .3s}
#ring .ic{font-size:96px;animation:shake 1s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
#ring .tt{font-size:40px;font-weight:800}
#ring .tm{font-size:96px;font-weight:250;letter-spacing:-.03em}
#ring .sb{font-size:18px;opacity:.9}
#ring .row{display:flex;gap:14px;margin-top:10px}
#ring .btn{min-width:200px;min-height:72px;font-size:22px;border-radius:22px;background:#fff;color:#111}
#ring .btn.ghost{background:rgba(255,255,255,.22);color:#fff}

/* ---------- お知らせ ---------- */
#banners{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100% - 32px));pointer-events:none}
.banner{pointer-events:auto;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:12px 16px;
  background:rgba(20,22,30,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;box-shadow:0 16px 40px rgba(0,0,0,.35);animation:bin .35s cubic-bezier(.2,1.2,.4,1);transition:opacity .3s,transform .3s}
.banner .i{font-size:24px;flex:none}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font-size:15px}
.banner small{display:block;font-size:13.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.out{opacity:0;transform:translateY(-12px)}
@keyframes bin{from{transform:translateY(-20px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);z-index:130;background:rgba(20,22,30,.92);color:#fff;
  padding:13px 22px;border-radius:16px;font-size:15px;font-weight:600;max-width:min(640px,calc(100% - 32px));text-align:center;line-height:1.5;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:#c62f26}
#audioNotice{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:60;background:rgba(20,22,30,.82);color:#fff;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;pointer-events:none}

/* ---------- ログイン ---------- */
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.lg-card{width:min(460px,100%);background:var(--tile);border-radius:30px;padding:30px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lg-logo{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.lg-logo svg{width:52px;height:52px;flex:none}
.lg-or{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg-msg{font-size:14px;line-height:1.6;min-height:0}
.lg-msg.err{color:var(--danger)}.lg-msg.ok{color:var(--ok)}
.gbtn{background:#fff;color:#1f1f1f;border:1.5px solid #dadce0}
:root[data-theme=dark] .gbtn{background:#202124;color:#e8eaed;border-color:#5f6368}

</style>
</head>
<body>
<main id="board">
  <!-- 時計・天気 -->
  <section class="tile t-clock" id="tClock">
    <div class="ck-top">
      <div class="ck-date" id="ckDate"></div>
      <button class="glassbtn" id="ckWxBtn" aria-label="天気の詳細">🌤️</button>
      <button class="glassbtn" id="ckSet" aria-label="設定">⚙︎</button>
    </div>
    <div class="ck-time num" id="ckTime"></div>
    <div class="ck-wx" id="ckWx"></div>
    <div class="ck-hours num" id="ckHours"></div>
    <div class="ck-foot"><span id="ckAlarm"></span><span id="ckPlace"></span></div>
  </section>

  <!-- ニュース -->
  <section class="tile" id="tNews">
    <div class="thead"><h2><span class="ic">📰</span>ニュース</h2><span class="sp"></span><div class="chips" id="nwTabs"></div></div>
    <div class="nw-list" id="nwList"></div>
    <div class="nw-foot"><span id="nwSrc"></span><span id="nwUp"></span></div>
  </section>

  <!-- LINE -->
  <section class="tile" id="tLine">
    <div class="thead"><h2><span class="ic ln-ic">LINE</span>LINE</h2><span class="badge" id="lnBadge" hidden></span><span class="sp"></span><span class="ln-state" id="lnState"></span></div>
    <div class="tbody" id="lnBody"></div>
  </section>

  <!-- タイマー・アラーム・ストップウォッチ -->
  <section class="tile" id="tTimer">
    <div class="thead"><div class="seg" id="tmTabs">
      <button data-tm="timer">⏳ タイマー</button><button data-tm="alarm">⏰ アラーム</button><button data-tm="sw">⏱ ストップウォッチ</button></div></div>
    <div class="tm-view" id="tmBody"></div>
  </section>

  <!-- 音楽（YouTube） -->
  <section class="tile" id="tMusic">
    <div class="thead"><h2><span class="ic">🎵</span>音楽</h2><span class="sp"></span><button class="btn sm" id="muFind">🔍 曲をさがす</button></div>
    <div class="tbody" id="muBody"></div>
  </section>

  <!-- レシピ -->
  <section class="tile" id="tRecipe">
    <div class="thead"><h2><span class="ic">🍳</span>レシピ</h2><span class="sp"></span><div class="seg" id="rcTabs"><button data-rc="world">🌍 世界</button><button data-rc="ai">✨ AI</button></div></div>
    <div class="tbody" id="rcBody"></div>
  </section>
</main>

<!-- YouTube の再生画面（タイルの上に重ねて表示します） -->
<div id="ytDock" hidden><div id="ytPlayer"></div></div>

<!-- 鳴動画面 -->
<div id="ring" role="alertdialog" aria-live="assertive">
  <div class="ic" id="ringIcon">⏰</div>
  <div class="tt" id="ringTitle"></div>
  <div class="tm num" id="ringTime"></div>
  <div class="sb" id="ringSub"></div>
  <div class="row"><button class="btn ghost" id="ringSnooze">5分後にもう一度</button><button class="btn" id="ringStop">止める</button></div>
</div>

<!-- ログイン -->
<div id="login" hidden>

<script type="module">
/* たいアカウント（Firebase プロジェクト tai-account）— nicehome+ と同じアカウント・同じデータを使います。

import {

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, setDoc, getDoc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNKPM8KCe6RGWuaQOUDorBtjCD3IGoe1E",
  authDomain: "tai-account.firebaseapp.com",
  projectId: "tai-account",
  storageBucket: "tai-account.firebasestorage.app",
  messagingSenderId: "579819210756",
  appId: "1:579819210756:web:7eba19a9d4c2ac7697cd51"
};
const app = initializeApp(firebaseConfig);
let db;
try{ db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ db = getFirestore(app); }

window.FBX = {

  onAuthStateChanged, signInWithEmailAndPassword, signOut, signInWithPopup,

window.dispatchEvent(new Event('fbx-ready'));

<script>
/* =====================================================================
   nice home board
   ===================================================================== */
const VERSION = '1.1.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WD = '日月火水木金土';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = encodeURIComponent;
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
function decodeHtml(s){ const t = document.createElement('textarea'); t.innerHTML = String(s || ''); return t.value; }
function stripTags(s){ const d = document.createElement('div'); d.innerHTML = String(s || ''); return (d.textContent || '').trim(); }
function fmtAgo(t){
  if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'たった今'; if (m < 60) return `${m}分前`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}時間前`;
  const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`;
}
const fmtHMs = t => { const d = new Date(t); return `${d.getHours()}:${pad(d.getMinutes())}`; };
async function fetchT(url, opt = {}, ms = 12000){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms);
  try{ return await fetch(url, Object.assign({}, opt, {signal:ctl.signal})); }
  finally{ clearTimeout(to); }
}

/* ---------- 保存 ----------
   nhb_active … この端末で使っているアカウント（uid / 'guest' / 空＝未ログイン）
   データは「nhb:<uid>:キー」に保存します。nicehome+ と共通のもの（設定・アラーム）は、
   Firestore の niceHomePlus/<uid> に、nicehome+ と同じ形で保存します。 */
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const ACTIVE = LS.get('nhb_active') || '';
const NS = `nhb:${ACTIVE || '_'}:`;
const DEVICE_ID = (() => { let d = LS.get('nhb_device'); if (!d){ d = 'b' + Math.random().toString(36).slice(2, 10); LS.set('nhb_device', d); } return d; })();
const store = {
  get(k, d){ const v = LS.get(NS + k); if (v == null) return d; try{ return JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ LS.set(NS + k, JSON.stringify(v)); },
  del(k){ LS.del(NS + k); }
};
let USER = null;

/* ---------- 設定 ----------
   P … nicehome+ と共通の設定（そのままの形で保存し、書き戻すときもほかの項目を消さないようにします）
   B … このボード専用の設定 */
const P_DEF = {theme:'auto', accent:'#2f6fed', hour12:false, showSeconds:true, weatherName:'越谷市', weatherLat:35.8911, weatherLon:139.7909,
  geminiKey:'', aiModel:'gemini-flash-latest', youtubeKey:'', ytVol:1, lineCode:'', lineNotif:true, notifSound:true, wakeLock:true};
let P = Object.assign({}, P_DEF, store.get('plus', {}));
const B_DEF = {theme:'plus', accent:'', news:'nhk0', recipe:'world', tm:'timer', wake:true, nightDim:true, sec:'plus', muTerm:''};
let B = Object.assign({}, B_DEF, store.get('prefs', {}));
let alarms = store.get('alarms', []);
const cfg = {
  theme(){ return B.theme === 'plus' ? (P.theme || 'auto') : B.theme; },
  accent(){ return B.accent || P.accent || '#2f6fed'; },
  seconds(){ return B.sec === 'plus' ? P.showSeconds !== false : B.sec === 'on'; }
};

/* ---------- nicehome+ との共有（たいアカウント） ---------- */
const SHARED_KEYS = ['settings', 'alarms', 'nhBoard'];
const Shared = {
  uid:null, unsub:null, gotFirst:false, remoteHasSettings:false, state:'none',
  meta:store.get('meta', {}), pending:new Set(store.get('pending', [])), timer:null,
  ref(){ return FBX.doc(FBX.db, 'niceHomePlus', this.uid); },
  start(uid){
    if (this.unsub) return;
    this.uid = uid; this.state = 'syncing';
    this.unsub = FBX.onSnapshot(this.ref(), snap => this.onRemote(snap.exists() ? snap.data() : null), e => { console.warn('shared', e); this.state = 'error'; renderSettingsState(); });
  },
  stop(){ if (this.unsub) this.unsub(); this.unsub = null; this.uid = null; this.gotFirst = false; },
  onRemote(data){
    const d = (data && data.d) || {};
    this.remoteHasSettings = !!d.settings;
    for (const k of SHARED_KEYS){
      const o = d[k];
      if (!o || this.pending.has(k) || (o.t || 0) <= (this.meta[k] || 0)) continue;
      let v = null; try{ v = o.v == null ? null : JSON.parse(o.v); }catch(e){ continue; }
      this.meta[k] = o.t;
      if (k === 'settings' && v){ P = Object.assign({}, P_DEF, v); store.set('plus', P); }
      if (k === 'alarms'){ alarms = Array.isArray(v) ? v : []; store.set('alarms', alarms); }
      if (k === 'nhBoard' && v){ B = Object.assign({}, B_DEF, v); store.set('prefs', B); }
      onSharedChanged(k);
    }
    store.set('meta', this.meta);
    if (!this.gotFirst){ this.gotFirst = true; this.flush(); }
    this.state = this.pending.size ? 'syncing' : 'ok'; renderSettingsState();
  },
  /* 共有するデータを書き込みます（新しい方が優先されます） */
  put(k){
    this.meta[k] = Math.max(Date.now(), (this.meta[k] || 0) + 1); store.set('meta', this.meta);
    if (!USER) return;
    this.pending.add(k); store.set('pending', [...this.pending]);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 600);
  },
  async flush(){
    if (!this.uid || !window.FBX || !this.pending.size || !this.gotFirst) return;
    const d = {}, keys = [...this.pending];
    keys.forEach(k => {
      const v = k === 'settings' ? P : k === 'alarms' ? alarms : B;
      d[k] = {v:JSON.stringify(v), t:this.meta[k] || Date.now(), dev:DEVICE_ID};
    });
    try{
      await FBX.setDoc(this.ref(), {d, updatedAt:FBX.serverTimestamp()}, {merge:true});
      keys.forEach(k => this.pending.delete(k)); store.set('pending', [...this.pending]);
      this.state = 'ok';
    }catch(e){
      console.warn('shared flush', e); this.state = navigator.onLine === false ? 'offline' : 'error';
      clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 15000);
    }
    renderSettingsState();
  }
};
window.addEventListener('online', () => Shared.flush());
function savePlus(){ store.set('plus', P); Shared.put('settings'); }
function savePrefs(){ store.set('prefs', B); Shared.put('nhBoard'); }
function saveAlarms(){ store.set('alarms', alarms); Shared.put('alarms'); renderTimerTile(); renderClockFoot(); }
function onSharedChanged(k){
  if (k === 'settings' || k === 'nhBoard'){
    applyTheme(); renderClock(true); renderNewsTabs(); renderRecipeTabs(); renderTmTabs();
    const wkey = `${P.weatherLat},${P.weatherLon}`; if (!wx || wx.key !== wkey) loadWeather(true); else renderWeather();
    lineListen(); loadSongs(); renderMusic(); renderRecipe(); renderLineTile(); loadNews();
    B.recipe === 'ai' ? loadAI() : loadWorld();
    if (P.geminiKey) translateWorldTitles();
    if (sheetKind === 'settings') renderSettings();
  }
  if (k === 'alarms'){ renderTimerTile(); renderClockFoot(); }
}

/* ---------- 見た目（テーマ・アクセントカラー） ---------- */
function hexToRgb(hex){ let v = String(hex || '#2f6fed').replace('#', ''); if (v.length === 3) v = v.split('').map(c => c + c).join(''); const n = parseInt(v, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lum(rgb){ const f = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }; return .2126 * f(rgb[0]) + .7152 * f(rgb[1]) + .0722 * f(rgb[2]); }
const isNight = () => { const h = new Date().getHours(); return h >= 18 || h < 6; };
function isDark(){ const t = cfg.theme(); return t === 'dark' || (t === 'auto' && isNight()); }
function applyTheme(){
  const r = document.documentElement, dark = isDark(), acc = cfg.accent(), L = lum(hexToRgb(acc));
  r.dataset.theme = dark ? 'dark' : 'light';
  r.style.setProperty('--accent', acc);
  r.style.setProperty('--on-accent', L > .45 ? '#111111' : '#ffffff');
  r.style.setProperty('--accent-text', dark ? (L < .12 ? '#8fb0ff' : acc) : (L > .45 ? '#1b1d22' : acc));
  $('meta[name=theme-color]').content = dark ? '#08090b' : '#eceef3';
  const h = new Date().getHours();
  document.getElementById('board').style.filter = dark && B.nightDim && (h >= 22 || h < 5) ? 'brightness(.78)' : '';   // 深夜は少し暗くします
}

/* ---------- お知らせ ---------- */
let toastT = null;
function toast(msg, kind = ''){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = kind; }, kind === 'err' ? 5200 : 3000);
}
function banner({icon = '🔔', title, body = '', onClick = null, sound = true}){
  const b = el(`<button class="banner"><span class="i">${esc(icon)}</span><span class="tx"><b>${esc(title)}</b>${body ? `<small>${esc(body)}</small>` : ''}</span></button>`);
  b.onclick = () => { b.remove(); if (onClick) onClick(); };
  $('#banners').prepend(b);
  [...$('#banners').children].slice(3).forEach(x => x.remove());
  setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 350); }, 6500);
  if (sound && P.notifSound !== false) playSound('soft');
}
function confirmDialog(msg, ok = 'OK', danger = false){
  return new Promise(res => {
    const bg = el(`<div class="sheet-bg" style="z-index:125"><div class="sheet narrow" style="height:auto"><div class="sh-body" style="font-size:17px;line-height:1.7">${esc(msg)}
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn" data-a="0">キャンセル</button><button class="btn ${danger ? 'danger' : 'primary'}" data-a="1">${esc(ok)}</button></div></div></div></div>`);
    bg.onclick = e => { const a = e.target.closest('[data-a]'); if (a || e.target === bg){ bg.remove(); res(!!(a && a.dataset.a === '1')); } };
    document.body.append(bg);
  });
}

/* ---------- 音 ---------- */
let actx = null, audioOK = false;
function ac(){ if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; actx = new AC(); } return actx; }
function unlockAudio(){
  try{
    const c = ac(); if (c.state !== 'running') c.resume();
    const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0);
    audioOK = true; $('#audioNotice').hidden = true;
  }catch(e){}
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
function beep(freq, start, dur, type = 'sine', vol = .3){
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + .01); g.gain.exponentialRampToValueAtTime(.0001, start + dur);
  o.connect(g).connect(c.destination); o.start(start); o.stop(start + dur + .05);
}
const SOUNDS = {
  bell:   {name:'ベル',     play:t => [0, .28, .56].forEach(d => { beep(1318, t + d, .7, 'triangle', .35); beep(2637, t + d, .3, 'sine', .08); })},
  digital:{name:'電子音',   play:t => [0, .14, .28, .42].forEach(d => beep(2000, t + d, .09, 'square', .14))},
  soft:   {name:'やさしい', play:t => [523, 659, 784].forEach((f, i) => beep(f, t + i * .22, .8, 'sine', .32))}
};
function playSound(key){ try{ const c = ac(); if (c.state !== 'running') c.resume(); (SOUNDS[key] || SOUNDS.bell).play(c.currentTime + .02); }catch(e){} }

/* ---------- 鳴動画面（アラーム・タイマー） ---------- */
let ringLoop = null, ringAuto = null, ringSnoozeFn = null;
function startRing({icon = '⏰', title, sub = '', sound = 'bell', snooze = null}){
  stopRing(); ytPause();
  ringSnoozeFn = snooze;
  $('#ringIcon').textContent = icon; $('#ringTitle').textContent = title; $('#ringSub').textContent = sub;
  $('#ringSnooze').hidden = !snooze;
  $('#ringTime').textContent = fmtClock(new Date()).main;
  $('#ring').classList.add('show');
  playSound(sound); ringLoop = setInterval(() => playSound(sound), 1700);
  ringAuto = setTimeout(stopRing, 10 * 60 * 1000);
}
function stopRing(){ clearInterval(ringLoop); clearTimeout(ringAuto); ringLoop = null; $('#ring').classList.remove('show'); }
$('#ringStop').onclick = stopRing;
$('#ringSnooze').onclick = () => { if (ringSnoozeFn) ringSnoozeFn(); stopRing(); };

/* ---------- 画面をつけたままにする ---------- */
let wakeLock = null, wakePending = false;
async function requestWake(){
  if (!B.wake || !('wakeLock' in navigator) || wakeLock || wakePending || document.visibilityState !== 'visible') return;
  wakePending = true;
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }catch(e){}
  wakePending = false;
}
function releaseWake(){ if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWake(); });

/* ---------- 詳細画面（シート） ---------- */
let sheetKind = '', sheetClose = null;
function openSheet({kind, title, icon = '', body = '', fill = false, narrow = false, onClose = null}){
  closeSheet(true);
  const bg = el(`<div class="sheet-bg" id="sheet"><div class="sheet ${narrow ? 'narrow' : ''}" role="dialog" aria-label="${esc(title)}">
    <div class="sh-head"><h3>${icon ? `<span>${icon}</span>` : ''}<span class="clamp1">${esc(title)}</span></h3><button class="btn icon" id="shClose" aria-label="閉じる">✕</button></div>
    <div class="sh-body ${fill ? 'fill' : ''}" id="shBody">${body}</div></div></div>`);
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.append(bg);
  $('#shClose').onclick = () => closeSheet();
  sheetKind = kind; sheetClose = onClose;
  ytPlace();
  return $('#shBody');
}
function closeSheet(silent){
  const s = $('#sheet'); if (!s) return;
  s.remove();
  const f = sheetClose; sheetKind = ''; sheetClose = null;
  if (f) f();
  if (!silent) ytPlace();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- 時刻の表示 ---------- */
function fmtClock(d, withSec = false){
  let h = d.getHours(), ap = '';
  if (P.hour12){ ap = h < 12 ? '午前' : '午後'; h = h % 12 || 12; }
  return {ap, main:`${P.hour12 ? h : pad(h)}:${pad(d.getMinutes())}`, sec:withSec ? pad(d.getSeconds()) : ''};
}

/* =========================================================
   時計・天気
   ========================================================= */
let holidays = store.get('holidays', null);
async function loadHolidays(){
  if (holidays && Date.now() - holidays.at < 7 * 864e5) return;
  try{ const r = await fetchT('https://holidays-jp.github.io/api/v1/date.json'); if (r.ok){ holidays = {at:Date.now(), d:await r.json()}; store.set('holidays', holidays); renderClock(true); } }catch(e){}
}
let lastMin = -1, lastDay = '';
function renderClock(force){
  const now = new Date(), t = fmtClock(now, cfg.seconds());
  $('#ckTime').innerHTML = `${t.ap ? `<span class="ap">${t.ap}</span>` : ''}${t.main}${t.sec ? `<span class="sec">${t.sec}</span>` : ''}`;
  const dk = dateKey(now);
  if (force || dk !== lastDay){
    lastDay = dk;
    const hol = holidays && holidays.d && holidays.d[dk];
    $('#ckDate').innerHTML = `${now.getMonth() + 1}月${now.getDate()}日（${WD[now.getDay()]}）${hol ? `<small>${esc(hol)}</small>` : ''}`;
  }
  if (force || now.getMinutes() !== lastMin){ lastMin = now.getMinutes(); renderClockFoot(); }
}
function nextAlarm(){
  const now = new Date(); let best = null;
  for (const a of alarms){
    if (!a.enabled) continue;
    const [H, M] = a.time.split(':').map(Number);
    for (let i = 0; i < 8; i++){
      const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(H, M, 0, 0);
      if (d <= now) continue;
      if (a.days && a.days.length && !a.days.includes(d.getDay())) continue;
      if (!best || d < best.at) best = {at:d, a};
      break;
    }
  }
  return best;
}
function renderClockFoot(){
  const n = nextAlarm();
  let txt = '⏰ アラームはありません';
  if (n){
    const d = n.at, today = new Date(), tm = new Date(Date.now() + 864e5);
    const day = dateKey(d) === dateKey(today) ? '' : dateKey(d) === dateKey(tm) ? '明日 ' : `${WD[d.getDay()]}曜 `;
    txt = `⏰ 次のアラーム ${day}${fmtClock(d).ap}${fmtClock(d).main}`;
  }
  $('#ckAlarm').textContent = txt;
  $('#ckPlace').textContent = '📍' + (P.weatherName || '');
}

/* ---------- 天気（Open-Meteo、つながらないときは wttr.in） ---------- */
let wx = store.get('wx', null), wxLoading = null, wxErr = '', wxRetryT = null;
function wmo(c, day = 1){
  const M = {0:['快晴', day ? '☀️' : '🌙'], 1:['晴れ', day ? '🌤️' : '🌙'], 2:['晴れ時々くもり', '⛅'], 3:['くもり', '☁️'], 45:['霧', '🌫️'], 48:['霧', '🌫️'],
    51:['弱い霧雨', '🌦️'], 53:['霧雨', '🌦️'], 55:['強い霧雨', '🌧️'], 56:['着氷性の霧雨', '🌧️'], 57:['着氷性の霧雨', '🌧️'],
    61:['弱い雨', '🌦️'], 63:['雨', '🌧️'], 65:['強い雨', '🌧️'], 66:['着氷性の雨', '🌧️'], 67:['着氷性の雨', '🌧️'],

    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day` +

    `&timezone=auto&forecast_days=7&wind_speed_unit=ms`;
  wxLoading = (async () => {

function todayRest(D){

function fsVal(v){
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return +v.integerValue;
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return Date.parse(v.timestampValue);
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsVal);
  if ('mapValue' in v) return fsObj(v.mapValue.fields);
  return null;
}
const fsObj = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, fsVal(v)]));

async function nhkItems(rss){
  /* rss2json（JSON に変換するサービス）で読み込み、だめなときは allorigins 経由で XML を読み込みます */
  try{
    const r = await fetchT('https://api.rss2json.com/v1/api.json?rss_url=' + enc(rss), {}, 12000);
    const j = await r.json();
    if (j.status === 'ok' && j.items && j.items.length)
      return j.items.map(it => ({id:it.guid || it.link, title:decodeHtml(it.title), link:it.link, at:Date.parse(String(it.pubDate || '').replace(' ', 'T') + 'Z') || 0, desc:stripTags(it.description || it.content || '')}));
  }catch(e){}
  const r = await fetchT('https://api.allorigins.win/raw?url=' + enc(rss), {}, 15000);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const x = new DOMParser().parseFromString(await r.text(), 'text/xml');
  const items = [...x.querySelectorAll('item')].map(it => {
    const g = n => (it.querySelector(n) || {}).textContent || '';
    return {id:g('guid') || g('link'), title:g('title').trim(), link:g('link').trim(), at:Date.parse(g('pubDate')) || 0, desc:stripTags(g('description'))};
  });
  if (!items.length) throw new Error('記事が見つかりませんでした');
  return items;
}
async function tnewsItems(){

function lineListen(force){
  const want = lineReady() ? USER.uid + ':' + P.lineCode : '';
  if (!force && want === lineSub) return;
  if (lineUnsub){ try{ lineUnsub(); }catch(e){} lineUnsub = null; }
  lineSub = want; lineMsgs = [];
  if (!want){ lineState = {st:'off'}; renderLineTile(); return; }
  lineState = {st:'wait'};
  const code = P.lineCode;
  try{
    lineUnsub = FBX.onSnapshot(FBX.query(FBX.collection(FBX.db, 'lineRelay', code, 'msgs'), FBX.orderBy('at', 'desc'), FBX.limit(300)), snap => {
      const arr = [];
      snap.forEach(d => { const v = d.data() || {}; arr.push({id:d.id, chat:String(v.chat || 'LINE'), sender:String(v.sender || ''), text:String(v.text || ''), at:+v.at || 0, dev:String(v.dev || '')}); });

  }catch(e){ lineState = {st:'err', err:String(e)}; }

function lineOnMsgs(arr, code){

    arr.forEach(m => lineSeen.add(m.id));

    store.set('lineInit', true);
  } else {

    fresh.forEach(m => lineSeen.add(m.id));
    const show = fresh.filter(m => Math.abs(Date.now() - m.at) < 30 * 60000);
    if (P.lineNotif !== false && show.length){

/* =========================================================

const YTP = {api:null, player:null, ready:false, queue:[], idx:-1, state:-1};

function ytErr(st, j){

const MEAL_CAT = {Beef:'牛肉料理', Chicken:'鶏肉料理', Dessert:'デザート', Lamb:'ラム肉料理', Miscellaneous:'いろいろ', Pasta:'パスタ', Pork:'豚肉料理', Seafood:'魚介料理', Side:'副菜', Starter:'前菜', Vegan:'ヴィーガン', Vegetarian:'ベジタリアン', Breakfast:'朝ごはん', Goat:'ヤギ肉料理'};
const MEAL_AREA = {Japanese:'和食', Chinese:'中華', Italian:'イタリアン', French:'フレンチ', Indian:'インド料理', Thai:'タイ料理', Mexican:'メキシコ料理', American:'アメリカ料理', British:'イギリス料理', Spanish:'スペイン料理', Greek:'ギリシャ料理', Korean:'韓国料理', Vietnamese:'ベトナム料理', Turkish:'トルコ料理', Moroccan:'モロッコ料理', Canadian:'カナダ料理', Irish:'アイルランド料理', Jamaican:'ジャマイカ料理', Malaysian:'マレーシア料理', Russian:'ロシア料理', Tunisian:'チュニジア料理', Egyptian:'エジプト料理', Kenyan:'ケニア料理', Polish:'ポーランド料理', Portuguese:'ポルトガル料理', Croatian:'クロアチア料理', Dutch:'オランダ料理', Filipino:'フィリピン料理', Ukrainian:'ウクライナ料理', Uruguayan:'ウルグアイ料理'};

/* ---------- Gemini ---------- */
async function geminiRequest(body){
  const model = (P.aiModel || 'gemini-flash-latest').trim();
  let r;
  try{
    r = await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${enc(model)}:generateContent`, {
      method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':P.geminiKey}, body:JSON.stringify(body)}, 60000);
  }catch(e){ throw new Error('Gemini に接続できませんでした。ネットワーク接続をご確認ください'); }
  if (!r.ok){
    let msg = ''; try{ const j = await r.json(); msg = j.error && j.error.message || ''; }catch(e){}
    if (r.status === 429) throw new Error('Gemini の利用回数の上限に達しました。しばらく待ってから、もう一度お試しください（429）');
    if (r.status === 400 && /API key/i.test(msg)) throw new Error('Gemini の API キーが正しくありません。設定をご確認ください');
    if (r.status === 403) throw new Error('この API キーでは Gemini を使用できません（403）');
    if (r.status === 404) throw new Error(`モデル「${model}」が見つかりません（404）`);
    throw new Error(`Gemini でエラーが発生しました（${r.status}）${msg ? '：' + msg : ''}`);
  }
  return r.json();
}
async function geminiJSON(prompt, temperature = .4){
  const j = await geminiRequest({contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:{temperature, responseMimeType:'application/json'}});
  const c = j.candidates && j.candidates[0];
  const t = c && c.content && c.content.parts ? c.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join('') : '';
  return JSON.parse(t.replace(/^```(?:json)?\s*|\s*```$/g, ''));
}

/* ---------- 世界のレシピ ---------- */
async function loadWorld(force){
  const w = rcp.world;
  if (!force && w.items.length && Date.now() - w.at < 12 * 3600e3) return;
  if (rcpLoading.world) return; rcpLoading.world = true; renderRecipe();
  try{
    const got = await Promise.all(Array.from({length:10}, () => fetchT('https://www.themealdb.com/api/json/v1/1/random.php').then(r => r.json()).catch(() => null)));
    const seen = new Set(), items = [];
    got.forEach(j => { const m = j && j.meals && j.meals[0]; if (m && !seen.has(m.idMeal)){ seen.add(m.idMeal);
      items.push({id:m.idMeal, title:m.strMeal, en:m.strMeal, img:m.strMealThumb, cat:[MEAL_AREA[m.strArea] || m.strArea || '', MEAL_CAT[m.strCategory] || m.strCategory || ''].filter(Boolean).join('・')}); } });
    if (!items.length) throw new Error('レシピを読み込めませんでした');
    rcp.world = {at:Date.now(), items, i:0}; rcpErr.world = ''; store.set('rcp', rcp);
    rcpLoading.world = false; renderRecipe();
    await translateWorldTitles();
  }catch(e){ rcpErr.world = e.name === 'AbortError' || e instanceof TypeError ? '通信できませんでした' : e.message; }
  rcpLoading.world = false; renderRecipe();
}
let trBusy = false;
async function translateWorldTitles(){
  const items = rcp.world.items.filter(i => i.title === i.en);
  if (!items.length || !P.geminiKey || trBusy) return;
  trBusy = true;
  try{ const ja = await geminiJSON(`次の料理名を、日本の家庭で通じる自然な日本語の料理名に翻訳し、同じ順番の JSON 配列（文字列のみ）で返してください：${JSON.stringify(items.map(i => i.en))}`, .2);
    if (Array.isArray(ja)){ ja.forEach((t, i) => { if (items[i] && t) items[i].title = String(t); }); store.set('rcp', rcp); renderRecipe(); } }catch(e){}
  trBusy = false;
}
async function worldDetail(it){
  const key = 'rcpd:' + it.id;
  let d = store.get(key, null);
  if (d) return d;
  const r = await fetchT(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${enc(it.id)}`);
  const m = ((await r.json()).meals || [])[0]; if (!m) throw new Error('レシピが見つかりませんでした');
  const ings = []; for (let i = 1; i <= 20; i++){ const n = (m['strIngredient' + i] || '').trim(); if (n) ings.push({name:n, amount:(m['strMeasure' + i] || '').trim()}); }
  const steps = String(m.strInstructions || '').split(/\r?\n+/).map(s => s.replace(/^(step\s*)?\d+[.):]?\s*/i, '').trim()).filter(s => s.length > 2);
  d = {title:it.title, en:m.strMeal, img:m.strMealThumb, cat:it.cat, ingredients:ings, steps, video:m.strYoutube || '', src:m.strSource || '', ja:false};
  if (P.geminiKey){
    try{
      const t = await geminiJSON(`次の英語のレシピを、日本の家庭で作りやすい自然な日本語に翻訳してください。分量の単位（cup・tbsp・oz・lb など）は、グラム・ml・大さじ・小さじなど日本の単位に換算してください。
次の JSON の形だけで返してください：{"title":"料理名","ingredients":[{"name":"材料","amount":"分量"}],"steps":["手順1","手順2"],"tip":"作るときのコツ（1〜2文）"}
${JSON.stringify({title:m.strMeal, ingredients:ings, steps})}`, .2);
      if (t && Array.isArray(t.steps)) Object.assign(d, {title:t.title || d.title, ingredients:t.ingredients || d.ingredients, steps:t.steps, tip:t.tip || '', ja:true});
    }catch(e){ d.trErr = e.message; }
  }
  if (d.ja) store.set(key, d);
  return d;
}

function mealOfDay(){ const h = new Date().getHours(); return h < 10 ? '朝ごはん' : h < 15 ? '昼ごはん' : h < 17 ? 'おやつ' : '晩ごはん'; }
async function loadAI(force, hint){
  const a = rcp.ai;
  if (hint == null) hint = a.hint || '';

  if (!P.geminiKey){ renderRecipe(); return; }
  if (rcpLoading.ai) return; rcpLoading.ai = true; renderRecipe(); if (sheetKind === 'recipe') renderRecipeSheet();
  try{

    const prev = a.items.map(x => x.title).slice(0, 6);
    const list = await geminiJSON(`あなたは家庭料理の先生です。日本の家庭で作りやすいレシピを3つ考えてください。
条件：今日は${now.getMonth() + 1}月${now.getDate()}日（${WD[now.getDay()]}）${w ? `、天気は${w}` : ''}。次の食事は「${mealOfDay()}」です。季節の食材を使ってください。
${hint ? `利用者の希望：「${hint}」（この希望を最優先してください）` : ''}${prev.length ? `\n次の料理とは別のものにしてください：${prev.join('、')}` : ''}
次の JSON 配列の形だけで返してください（説明文は不要です）：
[{"title":"料理名","emoji":"料理を表す絵文字1つ","desc":"どんな料理か（40文字ほど）","time":調理時間（分・数字）,"servings":"2人分","ingredients":[{"name":"材料","amount":"分量"}],"steps":["手順1","手順2"],"tip":"おいしく作るコツ（1〜2文）"}]`, .9);
    if (!Array.isArray(list) || !list.length) throw new Error('レシピを作れませんでした');
    rcp.ai = {at:Date.now(), items:list.slice(0, 3).map(x => Object.assign({id:uid()}, x)), i:0, hint}; rcpErr.ai = ''; store.set('rcp', rcp);

    <h4>つくり方</h4><ol>${(d.steps || []).map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
    ${d.tip ? `<div class="tip">💡 ${esc(d.tip)}</div>` : ''}
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn" id="rcTimer">⏳ タイマーをセット</button>${d.video ? `<a class="btn" href="${esc(d.video)}" target="_blank" rel="noopener" style="text-decoration:none">▶ 作り方の動画</a>` : ''}</div>
    ${mode === 'world' ? '<p class="hint" style="margin-top:12px">レシピ：TheMealDB</p>' : '<p class="hint" style="margin-top:12px">このレシピは AI（Gemini）が考えたものです。分量や加熱時間は様子を見て調整してください。</p>'}</div>`;
  $('#rcTimer').onclick = () => { const m = Math.max(1, Math.min(180, parseInt(d.time, 10) || 10)); timer = {dur:m * 60000, endAt:Date.now() + m * 60000, remain:null}; saveTimer(); B.tm = 'timer'; savePrefs(); renderTimerTile(); closeSheet(); toast(`${m}分のタイマーを開始しました`); };
  if (mode === 'ai'){
    const go = async () => { const h = $('#aiHint').value.trim(); await loadAI(true, h); const s = rcp.ai; if (s.items[0]){ rcpOpen = {mode:'ai', it:s.items[0], d:s.items[0]}; renderRecipeSheet(); } };
    $('#aiGo').onclick = go; $('#aiHint').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}
$('#rcTabs').onclick = e => { const t = e.target.closest('[data-rc]'); if (!t) return; B.recipe = t.dataset.rc; savePrefs(); renderRecipe(); B.recipe === 'ai' ? loadAI() : loadWorld(); };
$('#rcBody').addEventListener('click', e => {
  const t = e.target.closest('[data-rc-a]'); if (!t) return;
  const a = t.dataset.rcA, mode = B.recipe, s = rcp[mode];
  if (a === 'set') return openSettings('keys');
  if (a === 'open') return openRecipe();
  if (a === 'reload') return mode === 'ai' ? loadAI(true) : loadWorld(true);
  if (a === 'next'){
    if (s.i + 1 < s.items.length){ s.i++; store.set('rcp', rcp); renderRecipe(); }
    else mode === 'ai' ? loadAI(true) : loadWorld(true);
  }
});

/* =========================================================
   設定
   ========================================================= */
function syncStateText(){
  if (!USER) return ACTIVE === 'guest' ? 'この端末だけに保存しています' : 'ログインしていません';
  return {ok:'nicehome+ と同期しています', syncing:'同期しています…', error:'同期できませんでした', offline:'オフラインです（つながると同期します）', none:''}[Shared.state] || '';
}
function renderSettingsState(){ const s = $('#stSync'); if (s) s.textContent = syncStateText(); }
function openSettings(focus){
  openSheet({kind:'settings', title:'設定', icon:'⚙︎'});
  renderSettings();
  if (focus){ const t = $(`[data-sec="${focus}"]`); if (t) t.scrollIntoView({block:'start'}); }
}

  const secOpt = [['plus', 'nicehome+ と同じ'], ['on', '表示する'], ['off', '表示しない']];
  b.innerHTML = `<div class="cols2"><div>
    <div class="sgroup" data-sec="account"><h4>たいアカウント</h4>
      <div class="srow"><div><b>${esc(name)}</b><div class="hint">${USER ? esc(USER.email || '') : ''}</div><div class="hint" id="stSync">${esc(syncStateText())}</div></div>
        <div class="r">${USER ? '<button class="btn danger sm" id="stLogout">ログアウト</button>' : '<button class="btn primary sm" id="stLogin">ログイン</button>'}</div></div>
      ${USER ? '<div class="srow"><span class="hint">天気の地域・Gemini と YouTube のキー・LINE の通知・アラームは、nicehome+ と共通です。ここで変えると nicehome+ にも反映されます。</span></div>' : ''}</div>
    <div class="sgroup"><h4>見た目</h4>
      <div class="srow col"><span>テーマ</span><div class="chips">${thOpt.map(([k, n]) => `<button class="chip ${B.theme === k ? 'on' : ''}" data-th="${k}">${n}</button>`).join('')}</div></div>
      <div class="srow col"><span>アクセントカラー</span><div class="r" style="justify-content:flex-start"><button class="chip ${!B.accent ? 'on' : ''}" data-ac="">nicehome+ と同じ</button>
        ${accents.map(c => `<button data-ac="${c}" aria-label="${c}" style="width:34px;height:34px;border-radius:50%;border:3px solid ${B.accent === c ? 'var(--text)' : 'transparent'};background:${c}"></button>`).join('')}
        <input type="color" id="stAcc" value="${esc(cfg.accent())}" style="width:44px;height:36px;border:none;background:none"></div></div>
      <div class="srow col"><span>時計の秒</span><div class="chips">${secOpt.map(([k, n]) => `<button class="chip ${B.sec === k ? 'on' : ''}" data-sec2="${k}">${n}</button>`).join('')}</div></div>
      <div class="srow"><span>24時間表示<br><small class="hint">nicehome+ と共通です</small></span><label class="switch"><input type="checkbox" id="st24" ${P.hour12 ? '' : 'checked'}><span></span></label></div>
      <div class="srow"><span>深夜（22時〜5時）は画面を少し暗くする</span><label class="switch"><input type="checkbox" id="stDim" ${B.nightDim ? 'checked' : ''}><span></span></label></div>
      <div class="srow"><span>画面をつけたままにする</span><label class="switch"><input type="checkbox" id="stWake" ${B.wake ? 'checked' : ''}><span></span></label></div>
    </div>
    <div class="sgroup"><h4>通知</h4>
      <div class="srow"><span>LINE が届いたら知らせる</span><label class="switch"><input type="checkbox" id="stLineN" ${P.lineNotif !== false ? 'checked' : ''}><span></span></label></div>
      <div class="srow"><span>通知の音</span><label class="switch"><input type="checkbox" id="stSnd" ${P.notifSound !== false ? 'checked' : ''}><span></span></label></div>
      <div class="srow"><span class="hint">LINE のペアリングコード：${P.lineCode ? `<b style="color:var(--text)">${esc((P.lineCode.match(/.{1,4}/g) || []).join('-'))}</b>（nicehome+ の設定で作成・変更できます）` : '未設定（nicehome+ の設定「LINE の通知（Android 経由）」で作成できます）'}</span></div>
    </div>
  </div><div>
    <div class="sgroup" data-sec="place"><h4>天気の地域</h4>
      <div class="srow col"><div style="display:flex;gap:8px"><input class="input" id="stPlace" placeholder="市区町村名（例：越谷、札幌）" value=""><button class="btn" id="stPlaceGo">検索</button></div>
        <div class="hint">いまの地域：${esc(P.weatherName)}</div><div id="stPlaceRes" style="display:flex;flex-direction:column;gap:6px"></div></div>
    </div>
    <div class="sgroup" data-sec="music"><h4>音楽のおすすめ</h4>
      <div class="srow col"><span>キーワード</span><div style="display:flex;gap:8px"><input class="input" id="stMuTerm" value="${esc(B.muTerm || '')}" placeholder="空欄：人気の音楽（例：YOASOBI、アニメ、ジブリ）"><button class="btn primary" id="stMuSave">保存</button></div>
        <span class="hint">入れた言葉で YouTube を検索して、音楽のタイルのおすすめにします。</span></div></div>

      <div class="srow col"><span>Gemini API キー（AI レシピ・翻訳）</span><div style="display:flex;gap:8px"><input class="input" id="stGem" type="password" value="${esc(P.geminiKey)}" placeholder="未登録" autocomplete="off" autocapitalize="off"><button class="btn" data-show="stGem">表示</button></div>

      <div class="srow col"><span>YouTube Data API キー（音楽）</span><div style="display:flex;gap:8px"><input class="input" id="stYt" type="password" value="${esc(P.youtubeKey)}" placeholder="未登録" autocomplete="off" autocapitalize="off"><button class="btn" data-show="stYt">表示</button></div>
        <span class="hint">Google Cloud で「YouTube Data API v3」を有効にして発行したキーです。</span></div>
      <div class="srow"><span class="hint">キーは${USER ? 'たいアカウント' : 'この端末'}に保存され、GitHub には公開されません。</span><button class="btn primary" id="stKeySave">保存</button></div>
    </div>
    <div class="sgroup"><h4>この画面について</h4>
      <div class="srow"><span>nice home board<br><small class="hint">バージョン ${VERSION}</small></span><button class="btn sm" id="stReload">再読み込み</button></div>
      <div class="srow"><span class="hint">iPad では、Safari の共有ボタンから「ホーム画面に追加」して開くと、上下のバーが消えて全画面で表示できます。</span></div>
      <div class="srow"><span class="hint">天気：Open-Meteo／ニュース：NHK ニュース（RSS）・たいきニュース／レシピ：TheMealDB・Gemini／音楽：YouTube</span></div>
    </div>
  </div></div>`;
}
document.addEventListener('click', async e => {
  if (sheetKind !== 'settings' || !e.target.closest('#shBody')) return;
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'stLogout') return doLogout();
  if (t.id === 'stLogin'){ LS.set('nhb_active', ''); location.reload(); return; }
  if (t.id === 'stReload') return location.reload();
  if (t.dataset.th){ B.theme = t.dataset.th; savePrefs(); applyTheme(); renderSettings(); }
  if (t.dataset.ac != null){ B.accent = t.dataset.ac; savePrefs(); applyTheme(); renderSettings(); }
  if (t.dataset.sec2){ B.sec = t.dataset.sec2; savePrefs(); renderClock(true); renderSettings(); }
  if (t.dataset.show){ const i = $('#' + t.dataset.show); i.type = i.type === 'password' ? 'text' : 'password'; t.textContent = i.type === 'password' ? '表示' : '隠す'; }
  if (t.id === 'stMuSave'){ B.muTerm = $('#stMuTerm').value.trim(); savePrefs(); toast(B.muTerm ? `おすすめを「${B.muTerm}」にしました` : 'おすすめを人気の音楽に戻しました'); await loadSongs(true); renderMusic(); }
  if (t.id === 'stKeySave'){
    const g = $('#stGem').value.trim(), y = $('#stYt').value.trim(), ych = y !== P.youtubeKey, gch = g !== P.geminiKey;
    P.geminiKey = g; P.youtubeKey = y; savePlus(); toast('API キーを保存しました');
    if (ych){ songs = null; loadSongs(true); }
    if (gch){ renderRecipe(); if (B.recipe === 'ai') loadAI(); }
  }
  if (t.id === 'stPlaceGo'){
    const q = $('#stPlace').value.trim(); if (!q) return;
    const res = $('#stPlaceRes'); res.innerHTML = '<div class="hint">検索しています…</div>';
    try{
      const r = await fetchT(`https://geocoding-api.open-meteo.com/v1/search?name=${enc(q)}&count=6&language=ja&format=json`);
      const j = await r.json(), list = j.results || [];
      res.innerHTML = list.length ? list.map((p, i) => `<button class="btn" style="justify-content:flex-start" data-pl="${i}">📍 ${esc(p.name)}<small class="hint">${esc([p.admin1, p.country].filter(Boolean).join('・'))}</small></button>`).join('') : '<div class="hint">見つかりませんでした。別の名前でお試しください</div>';
      res.onclick = ev => { const b2 = ev.target.closest('[data-pl]'); if (!b2) return; const p = list[+b2.dataset.pl];
        Object.assign(P, {weatherName:p.name, weatherLat:+p.latitude.toFixed(4), weatherLon:+p.longitude.toFixed(4)}); savePlus();
        toast(`天気の地域を「${p.name}」にしました`); loadWeather(true); renderClockFoot(); renderSettings(); };
    }catch(err){ res.innerHTML = '<div class="hint">検索できませんでした。ネットワークをご確認ください</div>'; }
  }
});
document.addEventListener('change', e => {
  if (sheetKind !== 'settings') return;
  const t = e.target;
  if (t.id === 'st24'){ P.hour12 = !t.checked; savePlus(); renderClock(true); renderTimerTile(); }
  if (t.id === 'stDim'){ B.nightDim = t.checked; savePrefs(); applyTheme(); }
  if (t.id === 'stWake'){ B.wake = t.checked; savePrefs(); t.checked ? requestWake() : releaseWake(); }
  if (t.id === 'stLineN'){ P.lineNotif = t.checked; savePlus(); }
  if (t.id === 'stSnd'){ P.notifSound = t.checked; savePlus(); }
  if (t.id === 'stAcc'){ B.accent = t.value; savePrefs(); applyTheme(); }
});

/* =========================================================
   ログイン（たいアカウント）
   ========================================================= */
const MARK = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#2f4fd6"/></linearGradient></defs>
  <rect width="64" height="64" rx="16" fill="url(#mg)"/><rect x="12" y="12" width="22" height="24" rx="6" fill="#fff"/><rect x="38" y="12" width="14" height="11" rx="4" fill="#fff" opacity=".75"/>
  <rect x="38" y="27" width="14" height="25" rx="5" fill="#fff" opacity=".9"/><rect x="12" y="40" width="22" height="12" rx="5" fill="#fff" opacity=".75"/></svg>`;
function lgMsg(t, k = ''){ const m = $('#lgMsg'); m.textContent = t; m.className = 'lg-msg ' + k; }
function authErr(e){
  const c = e && e.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'メールアドレスまたはパスワードが正しくありません';
  if (/popup-closed|cancelled-popup/.test(c)) return 'ログインが取り消されました';
  if (/popup-blocked/.test(c)) return 'ポップアップがブロックされました。ブラウザの設定で許可してください';
  if (/too-many-requests/.test(c)) return 'ログインの試行回数が多すぎます。しばらく待ってからお試しください';
  if (/network/.test(c)) return 'ネットワークに接続できません';
  return `ログインできませんでした（${c || e}）`;
}
function initLogin(){
  $('#lgLogo').innerHTML = MARK + '<span>nice home board</span>';
  $('#lgGoogle').onclick = async () => { if (!window.FBX) return lgMsg('たいアカウントに接続できません。ページを再読み込みしてください', 'err'); try{ await FBX.signInWithPopup(FBX.auth, FBX.googleProvider); }catch(e){ lgMsg(authErr(e), 'err'); } };
  const sub = async () => {
    const email = $('#lgEmail').value.trim(), pass = $('#lgPass').value;
    if (!email || !pass) return lgMsg('メールアドレスとパスワードを入力してください', 'err');
    if (!window.FBX) return lgMsg('たいアカウントに接続できません', 'err');
    lgMsg('ログインしています…');
    try{ await FBX.signInWithEmailAndPassword(FBX.auth, email, pass); }catch(e){ lgMsg(authErr(e), 'err'); }
  };
  $('#lgSubmit').onclick = sub; $('#lgPass').onkeydown = e => { if (e.key === 'Enter') sub(); };
  $('#lgGuest').onclick = () => { LS.set('nhb_active', 'guest'); location.reload(); };
}
function initAccount(){
  if (!ACTIVE) $('#login').hidden = false;
  const start = () => FBX.onAuthStateChanged(FBX.auth, user => {
    if (user){
      if (ACTIVE !== user.uid){ LS.set('nhb_active', user.uid); location.reload(); return; }
      USER = user; $('#login').hidden = true;
      Shared.start(user.uid); lineListen(); renderLineTile();
      if (sheetKind === 'settings') renderSettings();
    } else {
      USER = null; Shared.stop(); lineListen();
      if (ACTIVE !== 'guest') $('#login').hidden = false;
    }
  });
  if (window.FBX) start(); else window.addEventListener('fbx-ready', start, {once:true});
}
async function doLogout(){
  if (!(await confirmDialog('ログアウトしてもよろしいですか？（nicehome+ のデータは消えません）', 'ログアウト', true))) return;
  try{ await Shared.flush(); }catch(e){}
  if (window.FBX){ try{ await FBX.signOut(FBX.auth); }catch(e){} }
  try{ Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); }catch(e){}
  LS.set('nhb_active', ''); location.reload();
}

/* =========================================================
   起動・時刻ごとの処理
   ========================================================= */
let lastSec = -1, lastHour = -1;
function everySecond(now){
  renderClock();
  checkAlarms(now);
  if (now.getSeconds() === 0){
    const m = now.getMinutes();
    if (m % 10 === 0) loadWeather();
    if (m % 15 === 0) loadNews();
    if (m % 3 === 0 && B.recipe === 'world' && !sheetKind && rcp.world.items.length > 1){ rcp.world.i = (rcp.world.i + 1) % rcp.world.items.length; store.set('rcp', rcp); renderRecipe(); }
    if (m % 5 === 0) renderLineTile();
    if (now.getHours() !== lastHour){ lastHour = now.getHours(); applyTheme(); loadHolidays(); }
  }
  if (now.getSeconds() % 5 === 0) lineListen();
}
setInterval(() => {
  const now = new Date();
  if (now.getSeconds() !== lastSec){ lastSec = now.getSeconds(); everySecond(now); }
  tickTimers();
}, 100);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ loadWeather(); loadNews(); renderClock(true); } });

applyTheme();
initLogin();
initAccount();
renderClock(true);
renderWeather();
renderNewsTabs(); renderNews();
renderLineTile();
renderTimerTile();
renderMusic();
renderRecipe();
loadHolidays();
loadWeather();
loadNews();
loadSongs();
B.recipe === 'ai' ? loadAI() : loadWorld();
newsAuto();
requestWake();
setTimeout(() => { if (!audioOK) $('#audioNotice').hidden = false; }, 2500);
setTimeout(() => { $('#audioNotice').hidden = true; }, 12000);

</script>
